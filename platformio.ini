; FYSETC SD-WIFI (rev 2.x, ESP-M2 / ESP8285) - turbo build
;
;   pio run                      -> build (firmware at .pio/build/sdwifi/firmware.bin)
;   pio run -t upload --upload-port COMx     -> flash over USB
;      (switch to USB2UART, hold FLSH while plugging in, release)
;   pio run -e sdwifi_ota -t upload --upload-port <board-ip>   -> flash over WiFi

[platformio]
src_dir = .
default_envs = sdwifi

[env:sdwifi]
platform = espressif8266@4.2.1        ; Arduino core 3.1.2
board = esp8285
framework = arduino
board_build.f_cpu = 160000000L        ; 160 MHz - big win for SPI + TCP throughput
board_build.flash_mode = dout         ; ESP8285 requires DOUT
board_build.ldscript = eagle.flash.1m.ld
build_unflags = -Os
build_flags =
    -O2                                               ; speed over size - 1MB flash has room
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH   ; MSS 1460
    -D DAV_DEBUG=0
    -D FS_NO_GLOBALS                                  ; SdFat 1.x File vs core fs::File clash
build_src_filter = +<*> -<examples/> -<ini/>
lib_deps =
    greiman/SdFat@1.1.4
monitor_speed = 115200
upload_speed = 460800

[env:sdwifi_ota]
extends = env:sdwifi
upload_protocol = espota
upload_flags = --auth=fysetc
; upload_port = 192.168.1.50
