<svg width="920" height="440" viewBox="0 0 920 440" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="920" height="440" rx="14" fill="#0b101d"/>

  <!-- title block -->
  <text x="40" y="46" fill="#ffffff" font-size="20" font-weight="700">WebDAV throughput — stock vs turbo firmware</text>
  <text x="40" y="70" fill="#9fb0cc" font-size="13">2 MB transfer · same board, same card, same WiFi (FYSETC SD-WIFI rev 2.1, ESP8285)</text>

  <!-- legend -->
  <g font-size="12">
    <circle cx="700" cy="42" r="5" fill="#d95926"/>
    <text x="711" y="46" fill="#c9d6ea">Stock</text>
    <circle cx="768" cy="42" r="5" fill="#3987e5"/>
    <text x="779" y="46" fill="#c9d6ea">Turbo</text>
  </g>

  <!-- gridlines: 0..1000 KB/s mapped to x 170..870 (0.7 px per KB/s) -->
  <g stroke="#1b2437" stroke-width="1">
    <line x1="345" y1="100" x2="345" y2="330"/>
    <line x1="520" y1="100" x2="520" y2="330"/>
    <line x1="695" y1="100" x2="695" y2="330"/>
    <line x1="870" y1="100" x2="870" y2="330"/>
  </g>
  <g fill="#6f83a6" font-size="11">
    <text x="170" y="352" text-anchor="middle">0</text>
    <text x="345" y="352" text-anchor="middle">250</text>
    <text x="520" y="352" text-anchor="middle">500</text>
    <text x="695" y="352" text-anchor="middle">750</text>
    <text x="870" y="352" text-anchor="middle">1,000 KB/s</text>
  </g>
  <line x1="170" y1="100" x2="170" y2="330" stroke="#2a3752" stroke-width="1.5"/>

  <!-- Download group: stock 62 -> 43px, turbo 1000 -> 700px -->
  <text x="152" y="146" fill="#c9d6ea" font-size="14" font-weight="600" text-anchor="end">Download</text>
  <path d="M170 118 h39 a4 4 0 0 1 4 4 v12 a4 4 0 0 1 -4 4 h-39 z" fill="#d95926"/>
  <text x="219" y="132" fill="#e7edf7" font-size="12" dominant-baseline="middle">62 KB/s</text>
  <path d="M170 142 h696 a4 4 0 0 1 4 4 v12 a4 4 0 0 1 -4 4 h-696 z" fill="#3987e5"/>
  <text x="860" y="156" fill="#0b101d" font-size="12" font-weight="700" text-anchor="end" dominant-baseline="middle">~1,000 KB/s</text>
  <text x="770" y="185" fill="#ffffff" font-size="15" font-weight="700" text-anchor="end">×16 faster</text>

  <!-- Upload group: stock 165 -> 115px, turbo 390 -> 273px -->
  <text x="152" y="248" fill="#c9d6ea" font-size="14" font-weight="600" text-anchor="end">Upload</text>
  <path d="M170 220 h111 a4 4 0 0 1 4 4 v12 a4 4 0 0 1 -4 4 h-111 z" fill="#d95926"/>
  <text x="291" y="234" fill="#e7edf7" font-size="12" dominant-baseline="middle">165 KB/s</text>
  <path d="M170 244 h269 a4 4 0 0 1 4 4 v12 a4 4 0 0 1 -4 4 h-269 z" fill="#3987e5"/>
  <text x="449" y="258" fill="#e7edf7" font-size="12" dominant-baseline="middle">~390 KB/s <tspan fill="#9fb0cc">(×2.4)</tspan></text>

  <!-- extra wins row -->
  <g font-size="12" fill="#9fb0cc">
    <text x="170" y="300">Also: folder listing ×1.8 · boot 20 s → 4 s · idle-connection hang (permanent on stock) → eliminated</text>
  </g>

  <!-- footer -->
  <text x="40" y="414" fill="#5c6f90" font-size="11">Measured 2026-08-06 with curl · full method &amp; raw numbers in benchmark_results.md · github.com/winitboonkliang/SD-WIFI-Turbo</text>
</svg>
